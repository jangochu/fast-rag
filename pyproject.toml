[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast-rag"
version = "0.1.0"
description = "A simple, fully-local RAG demo (FAISS + sentence-transformers + Ollama)"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-huggingface>=0.1,<0.3",
    "langchain-ollama>=0.2,<0.4",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fast-rag = "fast_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fast_rag"]
